[project]
name = "tack"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "run-in-rhino",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["rhino"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["layer_like_panel", "tack", "tack.analysis", "tack.prompting"]

[tool.uv.sources]
run-in-rhino = { path = "../run-in-rhino", editable = true }
