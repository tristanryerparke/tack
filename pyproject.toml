[project]
name = "tack"
version = "0.2.0"
description = "Analytic-plane relationships for Rhino"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8",
    "run-in-rhino; python_version >= '3.13'",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tack*"]
namespaces = true

[tool.uv.sources]
run-in-rhino = { path = "../run-in-rhino", editable = true }
